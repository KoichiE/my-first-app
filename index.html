
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contador de Eventos | Colegio Bolívar</title>

    <link rel="stylesheet" href="style.css">
    <script src="actions.js" defer></script>
</head>

<body>
    <main class="contenedor">
        <h1>Colegio Bolívar</h1>
        <p class="subtitulo">Contador interactivo de eventos</p>

        <section class="seccion-titulo">
            <label class="etiqueta" for="tituloEvento">
                Nombre del evento
            </label>

            <input
                type="text"
                id="tituloEvento"
                value="Evento escolar"
                placeholder="Escribe el nombre del evento..."
                maxlength="80"
            >

            <p class="titulo-evento" id="tituloActual">
                Evento escolar
            </p>
        </section>

        <section class="seccion-contador" aria-label="Contador de participaciones">
            <p class="etiqueta-contador">Participaciones registradas</p>

            <div
                class="contador"
                id="contador"
                aria-live="polite"
                aria-atomic="true"
            >0</div>
        </section>

        <section class="panel-meta" aria-label="Meta de participaciones">
            <label class="etiqueta" for="metaInput">
                Meta de participaciones
            </label>

            <input
                type="number"
                id="metaInput"
                value="100"
                min="1"
                max="1000000"
                step="1"
                aria-describedby="textoProgreso"
            >

            <div class="meta-encabezado">
                <span>Progreso de la meta</span>
                <span class="porcentaje" id="porcentaje">0%</span>
            </div>

            <div
                class="barra-fondo"
                id="barraFondo"
                role="progressbar"
                aria-label="Progreso de participaciones"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
            >
                <div class="barra-progreso" id="barraProgreso"></div>
            </div>

            <p
                class="texto-progreso"
                id="textoProgreso"
                aria-live="polite"
            >
                Faltan 100 participaciones para alcanzar la meta.
            </p>
        </section>

        <section class="controles" aria-label="Controles del contador">
            <button class="btn-sumar" id="sumar" type="button">
                + Registrar participación
            </button>

            <button class="btn-restar" id="restar" type="button">
                − Restar participación
            </button>

            <button class="btn-reiniciar" id="reiniciar" type="button">
                Reiniciar contador a cero
            </button>
        </section>

        <p class="mensaje" id="mensaje" role="status" aria-live="polite">
            ¡Listos para comenzar el evento!
        </p>

        <footer>
            Colegio Bolívar · Contador de eventos escolares
        </footer>
    </main>
</body>
</html>
